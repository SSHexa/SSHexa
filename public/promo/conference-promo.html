<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SSHexa — Conference Promo</title>
<style>
  :root {
    --navy: #0b1d3a;
    --navy-2: #122a55;
    --accent: #2bb3c0;
    --ink: #0f1c33;
    --soft: #eaf2fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a1830;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  body.capture { display: block; min-height: 0; background: transparent; }
  body.capture .stage { border-radius: 0; box-shadow: none; }
  .stage {
    width: 1600px;
    height: 900px;
    position: relative;
    background:
      radial-gradient(1100px 700px at 50% 35%, rgba(43,179,192,0.18) 0%, rgba(43,179,192,0) 60%),
      linear-gradient(135deg, #0b1d3a 0%, #122a55 55%, #1a3a7a 100%);
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  /* subtle grid texture removed — was creating faint horizontal/vertical lines */
  /* glow blobs */
  .blob {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; pointer-events: none;
  }
  .blob.a { width: 480px; height: 480px; background: #2bb3c0; top: -120px; left: -120px; }
  .blob.b { width: 520px; height: 520px; background: #4f7cff; bottom: -160px; right: -120px; opacity: 0.45; }

  /* Header */
  .header {
    position: absolute;
    top: 40px; left: 56px;
    display: flex; align-items: center; gap: 18px;
    z-index: 5;
  }
  .header img { width: 72px; height: 72px; object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
    background: white; border-radius: 14px; padding: 8px;
  }
  .brand { color: white; line-height: 1.1; }
  .brand .name { font-size: 32px; font-weight: 700; letter-spacing: 0.5px; }
  .brand .tag { font-size: 14px; font-weight: 400; color: #b9d4ee; margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase; }

  /* Headline */
  .headline {
    position: absolute;
    top: 70px; left: 56px; right: 56px;
    color: white; text-align: center;
    z-index: 4;
  }
  .headline p {
    font-size: 24px; font-weight: 700; color: #ffffff;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  /* Composition: hero (70%) on the left, side stack (30%) on the right */
  .composition {
    position: absolute;
    top: 150px; left: 56px; right: 56px;
    bottom: 90px;
    display: flex; align-items: stretch; justify-content: center;
    gap: 28px;
    z-index: 3;
  }
  .hero {
    flex: 0 0 68%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    background: #0b1d3a;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .hero img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .hero .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(11,29,58,0) 0%, rgba(11,29,58,0.85) 60%, rgba(11,29,58,0.95) 100%);
    color: white; font-size: 16px; font-weight: 600;
    letter-spacing: 0.3px;
  }

  .side-stack {
    flex: 1 1 0;
    display: flex; flex-direction: column;
    gap: 24px;
  }
  .side {
    flex: 1 1 0;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    background: #0b1d3a;
    position: relative;
  }
  .side img { width: 100%; height: 100%; object-fit: contain; display: block; clip-path: inset(2% 0 0 0); }
  .side .caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(11,29,58,0) 0%, rgba(11,29,58,0.85) 60%, rgba(11,29,58,0.95) 100%);
    color: white; font-size: 14px; font-weight: 600;
    letter-spacing: 0.3px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 28px; left: 56px; right: 56px;
    display: flex; align-items: center; justify-content: space-between;
    color: #cfe0f5; font-size: 14px;
    z-index: 5;
  }
  .footer .left { display: flex; align-items: center; gap: 10px; }
  .footer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .footer .url { color: white; font-weight: 600; letter-spacing: 0.5px; }
  .footer .right { color: white; font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
  .footer .right img { width: 44px; height: 44px; object-fit: contain; background: white; border-radius: 8px; padding: 4px; }
</style>
</head>
<body>
  <script>
    if (location.search.indexOf('capture') !== -1) document.documentElement.addEventListener('DOMContentLoaded', () => document.body.classList.add('capture'));
    document.addEventListener('DOMContentLoaded', () => { if (location.search.indexOf('capture') !== -1) document.body.classList.add('capture'); });
  </script>
  <div class="stage">
    <div class="blob a"></div>
    <div class="blob b"></div>

    <div class="headline">
      <p>Vitriflex — A Modular Platform for Cryo-EM Specimen Preparation</p>
    </div>

    <div class="composition">
      <div class="hero">
        <img src="screenshot.png" alt="SSHexa product interface" />
      </div>

      <div class="side-stack">
        <div class="side">
          <img src="Screenshot1.png" alt="IDS industrial camera" />
        </div>
        <div class="side">
          <img src="Screenshot2.png" alt="Vitriflex chamber closeup" />
          <div class="caption">On-Grid Mixing</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="left">
        <span class="dot"></span>
        <span class="url">sshexa.com</span>
      </div>
      <div class="right">
        <img src="/SSHexaLogo.png" alt="SSHexa logo" />
        <span>Hexa Robotics</span>
      </div>
    </div>
  </div>
</body>
</html>
